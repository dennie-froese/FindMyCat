<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Cancelled — Find My Cat</title>
  <meta name="description" content="Stripe checkout cancelled. Return to Find My Cat to activate free standard missing mode or try again.">
  <style>
    :root {
      --primary: #f05a3e;
      --secondary: #0f172a;
      --surface: #ffffff;
      --background: #fbfaf8;
      --border: #e2e8f0;
      --text-muted: #64748b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--background);
      color: var(--secondary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 16px 32px -10px rgba(15, 23, 42, 0.08);
    }
    h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; }
    p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      font-weight: 800;
      font-size: 1rem;
      padding: 15px 24px;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .sub-link {
      display: inline-block;
      font-size: 0.88rem;
      color: var(--text-muted);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Checkout Cancelled</h1>
    <p>
      No payment was taken. You can return to the Find My Cat app at any time to activate Standard Missing Mode for free or retry your Amber Alert boost.
    </p>
    <a href="findmycat://amber-alert-cancelled" class="btn">Return to Find My Cat App</a>
    <a href="/" class="sub-link">Back to Find My Cat Home</a>
  </main>
</body>
</html>
